<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Students</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">
            Student Management System
        </a>

        <div>

            <a href="/" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/students" class="btn btn-warning">
                Students
            </a>

            <a href="/export" class="btn btn-success mb-3">
    Export 
</a>
        </div>

    </div>

</nav>

<div class="container mt-5">

    <h2 class="mb-4">Student Records</h2>

    <a href="/add-student" class="btn btn-success mb-3">
        Add Student
    </a>

    <a href="/students/sorted"
   class="btn btn-info mb-3">
    Sort By Marks
</a>

    <form action="/search" method="get" class="mb-3">

    <div class="input-group">

        <input type="text"
               name="keyword"
               class="form-control"
               placeholder="Search student by name">

        <button class="btn btn-primary">
            Search
        </button>

    </div>

</form>

    <table class="table table-bordered table-striped">

        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

            <tr th:each="student : ${students}">
                <td th:text="${student.id}"></td>
                <td th:text="${student.name}"></td>
                <td th:text="${student.course}"></td>
                <td th:text="${student.marks}"></td>
<td>
    <a th:href="@{/edit-student/{id}(id=${student.id})}"
       class="btn btn-warning btn-sm">
        Edit
    </a>

                <td>
    <a th:href="@{/delete-student/{id}(id=${student.id})}"
       class="btn btn-danger btn-sm">
        Delete
    </a>
</td>
            </tr>

        </tbody>

    </table>

</div>

</body>
</html>
