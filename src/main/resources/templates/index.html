<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Student Management Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body class="d-flex flex-column min-vh-100"> 
    <!-- makes body flex, arrange vertical, lets footer stay at bottom -->

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container">

        <a class="navbar-brand" href="/">
            <i class="bi bi-mortarboard-fill"></i> 
        
            Student Management System

            <!-- <i class="bi bi-person-plus-fill"></i>
        Add Student -->

<!-- <i class="bi bi-pencil-square"></i> 
        Edit

<i class="bi bi-trash-fill"></i>
        Delete -->
        </a>

        <div>

            <a href="/" class="btn btn-light me-2">
                Dashboard
            </a>

            <a href="/students" class="btn btn-warning">
                Students
            </a>

        </div>

    </div>

</nav>

<!-- Dashboard Content -->
<div class="container mt-5">

    <h1 class="text-center mb-4">
        Dashboard
    </h1>

   <div class="row g-4">

    <div class="col-md-3">

        <div class="card shadow text-center border-primary">

            <div class="card-body">

                <h5>Total Students</h5>

                <h2 th:text="${totalStudents}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow text-center border-success">

            <div class="card-body">

                <h5>Average Marks</h5>

                <h2 th:text="${averageMarks}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow text-center border-warning">

            <div class="card-body">

                <h5>Highest Marks</h5>

                <h2 th:text="${highestMarks}"></h2>

            </div>

        </div>

    </div>

    <div class="col-md-3">

        <div class="card shadow text-center border-danger">

            <div class="card-body">

                <h5>Top Student</h5>

                <h5 th:text="${topStudent}"></h5>

            </div>

        </div>

    </div>

    <div class="card mt-5 shadow">

    <div class="card-body">

        <h4>Search Student</h4>

        <form action="/search" method="get">

            <div class="input-group">

                <input
                        type="number"
                        name="id"
                        class="form-control"
                        placeholder="Enter Student ID">

                <button class="btn btn-primary">
                    Search
                </button>

            </div>

        </form>
          </div>
</div>




        <div class="card mt-5 shadow">

    <div class="card-body">

        <h4 class="mb-4">
            Student Performance Chart
        </h4>

        <canvas id="marksChart"></canvas>

    </div>

</div>

  

    <!-- </div> -->

<!-- </div> -->

<footer class="bg-dark text-white text-center p-3 mt-auto">
    <p class="mb-0">
        Student Management System © 2026
    </p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const ctx =
document.getElementById('marksChart');

new Chart(ctx, {

    type: 'bar',

    data: {

        labels: ['Total Students'],

        datasets: [{

            label: 'Students',

            data: [[${totalStudents}]],

        }]
    }
});

</script>

</body>
</html>
